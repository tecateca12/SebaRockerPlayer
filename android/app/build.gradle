plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sebarocker.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.sebarocker.player"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    buildTypes {
        release {
            // Sign release APK with debug signing config by default so it installs directly on any tablet/phone without Play Store
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
