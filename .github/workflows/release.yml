name: Build and Release SebaRockerPlayer (macOS, Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2)'
        required: true
        default: 'v0.2'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build SebaRockerPlayer.app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --workpath build_out --name "SebaRockerPlayer" --collect-all sounddevice --collect-all _sounddevice_data --collect-all soundfile --collect-all _soundfile_data --collect-all miniaudio --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets main.py

      - name: Package macOS .app into ZIP
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "SebaRockerPlayer.app" "SebaRockerPlayer-macOS.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: dist/SebaRockerPlayer-macOS.zip

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build SebaRockerPlayer.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --workpath build_out --name "SebaRockerPlayer-Windows" --collect-all sounddevice --collect-all _sounddevice_data --collect-all soundfile --collect-all _soundfile_data --collect-all miniaudio --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist/SebaRockerPlayer-Windows.exe

  build-android:
    name: Build Android Tablet/Mobile (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SebaRockerPlayer-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: SebaRockerPlayer-Android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: release_assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-artifact
          path: release_assets

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SebaRockerPlayer ${{ github.ref_name }}"
          body: |
            ## SebaRockerPlayer ${{ github.ref_name }} 🎸🥁📝
            Reproductor dual sincronizado (**Backing Track + Click**) con **Teleprompter compatible con LivePrompter (`* L.txt`)** y precisión **Sample-Accurate** (cero desfasaje).

            ### Descargas Directas
            - 🤖 **Android (Tablet y Mobile):** `SebaRockerPlayer-Android.apk` (Instalador directo `.apk` para Tablets y celulares Android).
            - 🍎 **macOS:** `SebaRockerPlayer-macOS.zip` (Descomprimir y abrir `SebaRockerPlayer.app`).
            - 🪟 **Windows:** `SebaRockerPlayer-Windows.exe` (Ejecutable portable directo, no requiere instalar Python).

            📖 Ver [Manual de Uso Básico](./MANUAL_DE_USO.md).
          files: |
            release_assets/SebaRockerPlayer-Android.apk
            release_assets/SebaRockerPlayer-macOS.zip
            release_assets/SebaRockerPlayer-Windows.exe
